services:
  - type: web
    name: gener8server
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: GENER8_TOKEN_MINT
        sync: false
      - key: GENER8_TOKEN_DECIMALS
        value: "9"
      - key: GENER8_MIN_BALANCE
        value: "10000"
      - key: GENER8_DAILY_GENERATIONS
        value: "5"
      - key: VIDEO_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_TOKEN_BALANCE
        value: "25000"
